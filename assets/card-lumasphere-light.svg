<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 252" width="1200" height="252" role="img" aria-label="Lumasphere: The whole sky in infrared. Step inside NASA SPHEREx's all-sky map, tune through 102 infrared colors, and watch any patch of sky change over time.">
  <title>Lumasphere: The whole sky in infrared. Step inside NASA SPHEREx's all-sky map, tune through 102 infrared colors, and watch any patch of sky change over time.</title>
  <defs>
