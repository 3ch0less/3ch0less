<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="0x04, end of transmission">
  <title>0x04, end of transmission</title>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcf9"/><stop offset="1" stop-color="#f3f1ea"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4912f"/><stop offset="1" stop-color="#99690f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.15" fill="#e3dfd3"/>
    </pattern>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .silk{fill:#14181d}
    .dim{fill:#5b6470}
    .cu{fill:#a8771a}
    .sig{fill:#0a8a72}
    .trace{fill:none;stroke:#a8771a;stroke-linecap:round;stroke-linejoin:round}
    .bg{fill:none;stroke:#a8771a;stroke-opacity:0.38;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    .wave{fill:none;stroke:#0a8a72;stroke-width:2.6;stroke-linejoin:miter;stroke-dasharray:1;animation:wave 12s linear infinite}
    @keyframes wave{0%{stroke-dashoffset:1;opacity:1}40%,88%{stroke-dashoffset:0;opacity:1}94%,100%{stroke-dashoffset:0;opacity:0}}
    .eot{animation:eot 12s linear infinite}
    @keyframes eot{0%,24.2%{opacity:0}25.7%,88%{opacity:1}94%,100%{opacity:0}}
    .guide{stroke:#656d76;stroke-opacity:.4;stroke-width:1;stroke-dasharray:2 4}
  </style>
  <g class="guide"><path d="M515,12 V52"/><path d="M685,12 V52"/></g>
  <path class="wave" pathLength="1" d="M14,20 H515 V44 H532 H549 H566 V20 H583 V44 H600 H617 H634 H651 H668 V20 H685 H1186"/>
  <g class="eot"><rect x="518" y="60" width="164" height="28" rx="6" fill="#0a8a72" fill-opacity=".10" stroke="#0a8a72" stroke-opacity=".5"/>
  <text class="mono" x="600" y="79.5" text-anchor="middle" font-size="15"><tspan fill="#656d76">0x04</tspan><tspan fill="#1f2328" font-weight="700" dx="10">EOT</tspan></text></g>

</svg>
